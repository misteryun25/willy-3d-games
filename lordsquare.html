<style>
/* Layout: full-bleed 3D canvas; HUD top, joystick bottom-left, action bottom-right; dialogue = bottom sheet (portrait) or side panel (landscape). Single committed look. */
:root{--walnut:#2A1E16;--paper:#F3E8D3;--parch:#E6D4AF;--ink:#2A1F17;--ink2:#6A5442;--gold:#C8A04A;--terra:#A2442A;--ff:'Noto Serif TC','Songti TC',serif;--ff-l:'IM Fell English SC','Noto Serif TC',Georgia,serif;
  --joy:120px;color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--walnut);color:var(--paper);font-family:var(--ff);margin:0;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#touch{position:fixed;inset:0;z-index:2;touch-action:none}
.hud{position:fixed;top:0;left:0;right:0;z-index:4;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(rgba(25,17,11,.6),rgba(25,17,11,0))}
.hud .loc .lat{font-family:var(--ff-l);font-size:11px;letter-spacing:.22em;color:var(--gold)}
.hud .loc b{display:block;font-size:19px;font-weight:900;letter-spacing:.08em;line-height:1.2;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.hud .obj{text-align:right;font-size:13px;color:var(--parch);font-variant-numeric:tabular-nums;line-height:1.4;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.hud .obj b{color:#fff3da;font-size:15px}
.hud button{pointer-events:auto}
.icon{background:rgba(42,30,22,.6);border:1px solid rgba(200,160,74,.6);color:var(--parch);border-radius:999px;padding:4px 10px;font:inherit;font-size:12px;margin-top:4px}
#joy{position:fixed;z-index:3;width:var(--joy);height:var(--joy);margin:calc(var(--joy)/-2) 0 0 calc(var(--joy)/-2);border-radius:50%;pointer-events:none;
  border:2px solid rgba(243,232,211,.6);background:radial-gradient(circle,rgba(243,232,211,.12),rgba(42,30,22,.38));transition:opacity .2s}

#act{position:fixed;z-index:5;right:max(20px,calc(env(safe-area-inset-right,0px) + 12px));bottom:calc(28px + env(safe-area-inset-bottom,0px));
  min-width:84px;height:84px;border-radius:42px;padding:0 18px;border:2px solid var(--gold);background:rgba(162,68,42,.92);color:#fff3da;font:600 16px var(--ff);touch-action:manipulation;box-shadow:0 4px 14px rgba(0,0,0,.35)}
#act:active{transform:scale(.96)}
@media (orientation:landscape) and (max-height:520px){#act{height:68px;min-width:68px;border-radius:34px;bottom:calc(18px + env(safe-area-inset-bottom,0px))}}
#talk{position:fixed;z-index:6;left:0;right:0;bottom:0;background:var(--paper);color:var(--ink);border-top:3px solid var(--gold);
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -8px 28px rgba(0,0,0,.4);max-height:58%;overflow-y:auto;touch-action:pan-y}
@media (orientation:landscape){#talk{left:auto;top:0;width:min(48%,440px);max-height:none;border-top:0;border-left:3px solid var(--gold);padding-top:calc(16px + env(safe-area-inset-top,0px))}}

<script>
'use strict';
const $=s=>document.querySelector(s);

function rng(seed){let s=seed%2147483647;if(s<=0)s+=2147483646;return()=>(s=s*16807%2147483647)/2147483647;}

// sky dome with sun glow

 const cloud=ctex(256,128,(x,w,h)=>{for(let i=0;i<26;i++){const cx=40+Math.random()*176,cy=50+Math.random()*40,r=18+Math.random()*30;const g=x.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,'rgba(255,248,236,.55)');g.addColorStop(1,'rgba(255,248,236,0)');x.fillStyle=g;x.fillRect(0,0,w,h);}},{clamp:true});

const TX={
  rustic:ctex(512,512,(x,w,h)=>{x.fillStyle='#6b5a44';x.fillRect(0,0,w,h);let y=0;while(y<h){const bh=44+R()*26;let xx=-R()*80;while(xx<w){const bw=70+R()*110;const v=R()*30-15;x.fillStyle=`rgb(${168+v},${142+v},${104+v})`;x.fillRect(xx+3,y+3,bw-6,bh-6);
      const g=x.createLinearGradient(0,y,0,y+bh);g.addColorStop(0,'rgba(255,240,210,.28)');g.addColorStop(.25,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(40,25,10,.38)');x.fillStyle=g;x.fillRect(xx+3,y+3,bw-6,bh-6);
      for(let k=0;k<30;k++){x.fillStyle=`rgba(${R()<.5?'255,240,220':'50,30,10'},.12)`;x.fillRect(xx+4+R()*(bw-8),y+4+R()*(bh-8),2+R()*5,2+R()*4);}xx+=bw;}y+=bh;}}),
  ashlar:ctex(256,256,(x,w,h)=>{noiseFill(x,w,h,'#c9b38a',.07,500,[2,10]);x.strokeStyle='rgba(90,70,45,.35)';x.lineWidth=2;for(let y=0;y<h;y+=64){x.beginPath();x.moveTo(0,y);x.lineTo(w,y);x.stroke();for(let xx=(y/64%2)*64;xx<w;xx+=128){x.beginPath();x.moveTo(xx,y);x.lineTo(xx,y+64);x.stroke();}}}),
  paving:ctex(512,512,(x,w,h)=>{x.fillStyle='#6d5a42';x.fillRect(0,0,w,h);let y=0;while(y<h){const rh=48+R()*20;let xx=-R()*60;while(xx<w){const bw=56+R()*70;const v=R()*26-13;x.fillStyle=`rgb(${176+v},${158+v},${128+v})`;x.fillRect(xx+2,y+2,bw-4,rh-4);

const MT={

function add(geo,m,x,y,z,ry=0,parent=STATIC,opts={}){const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.rotation.y=ry;if(opts.rx)o.rotation.x=opts.rx;if(opts.rz)o.rotation.z=opts.rz;if(opts.s)o.scale.set(...opts.s);o.castShadow=opts.cast!==false;o.receiveShadow=true;parent.add(o);return o;}

add(new THREE.PlaneGeometry(900,900),mat(0x9a9468,{r:1}),0,-.06,0,0,STATIC,{rx:-Math.PI/2,cast:false});

function bifora(parent,x,y,z,s=1,ry=0){const g=new THREE.Group();g.position.set(x,y,z);g.rotation.y=ry;g.scale.setScalar(s);parent.add(g);

  add(G.cyl(.05,.05,1.9,8),MT.stone,0,1.1,.06,0,g);add(G.box(2.3,.14,.22),MT.stone,0,-.05,.06,0,g);

// ── Palazzo Vecchio (Palazzo della Signoria)
{const P=new THREE.Group();P.position.set(-14,0,-20);STATIC.add(P);
 const W=20,H=17,D=16;add(G.box(W,H,D),MT.rustic,0,H/2,0,0,P);
 [6.2,11.6].forEach(y=>add(G.box(W+.24,.3,D+.24),MT.stone,0,y,0,0,P));

 // portal
 flatArch(3.2,3.4,MT.stoneD,1.5,0,D/2+.02,0,P);flatArch(2.5,3.1,MT.recess,1.5,0,D/2+.04,0,P);
 // corbelled gallery + Guelph (square) merlons
 for(let i=0;i<18;i++){add(G.box(.42,1.1,.7),MT.stone,-9.6+i*1.13,16.6,D/2+.3,0,P);}
 for(let i=0;i<14;i++){add(G.box(.42,1.1,.7),MT.stone,W/2+.3,16.6,-7.2+i*1.1,Math.PI/2,P);add(G.box(.42,1.1,.7),MT.stone,-W/2-.3,16.6,-7.2+i*1.1,Math.PI/2,P);}
 add(G.box(W+1.2,2.6,D+1.2),MT.ashlar,0,18.4,0,0,P);
 // painted coats of arms of the Republic
 {const t=ctex(1024,64,(x,w,h)=>{x.fillStyle='#bba479';x.fillRect(0,0,w,h);const arms=[['#f1ead8','lily'],['#f1ead8','cross'],['split'],['#c23a2a','lilyW'],['#2c4a8a','keys']];
   for(let i=0;i<9;i++){const cx=56+i*114,a=arms[i%arms.length];x.save();x.translate(cx,6);x.beginPath();x.moveTo(-20,0);x.lineTo(20,0);x.lineTo(20,26);x.quadraticCurveTo(0,54,-20,26);x.closePath();x.clip();

function worldUV(g,s){const p=g.attributes.position,n=g.attributes.normal;const uv=new Float32Array(p.count*2);
  for(let i=0;i<p.count;i++){const ax=Math.abs(n.getX(i)),ay=Math.abs(n.getY(i)),az=Math.abs(n.getZ(i));let u,v;
    if(ay>=ax&&ay>=az){u=p.getX(i);v=p.getZ(i);}else if(ax>=az){u=p.getZ(i);v=p.getY(i);}else{u=p.getX(i);v=p.getY(i);}uv[i*2]=u/s;uv[i*2+1]=v/s;}
  g.setAttribute('uv',new THREE.BufferAttribute(uv,2));}

    STATIC.updateMatrixWorld(true);STATIC.traverse(o=>{if(o.isMesh&&o.material.userData.world){const g=o.geometry.clone();g.applyMatrix4(o.matrixWorld);worldUV(g,o.material.userData.world);const inv=new THREE.Matrix4().copy(o.matrixWorld).invert();g.applyMatrix4(inv);o.geometry=g;}});return;}
  STATIC.updateMatrixWorld(true);const buckets=new Map();
  STATIC.traverse(o=>{if(!o.isMesh)return;let g=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone();g.applyMatrix4(o.matrixWorld);
    Object.keys(g.attributes).forEach(a=>{if(!['position','normal','uv'].includes(a))g.deleteAttribute(a);});
    if(o.material.userData.world)worldUV(g,o.material.userData.world);
    if(!g.attributes.uv)g.setAttribute('uv',new THREE.BufferAttribute(new Float32Array(g.attributes.position.count*2),2));
    g.clearGroups();const k=o.material.uuid+(o.castShadow?'c':'n');if(!buckets.has(k))buckets.set(k,{m:o.material,cast:o.castShadow,list:[]});buckets.get(k).list.push(g);});
  while(STATIC.children.length)STATIC.remove(STATIC.children[0]);
  buckets.forEach(b=>{const merged=U.mergeBufferGeometries(b.list,false);if(!merged)return;const m=new THREE.Mesh(merged,b.m);m.castShadow=b.cast;m.receiveShadow=true;m.matrixAutoUpdate=false;STATIC.add(m);});}

  if(L.hat==='veil'){c.fillStyle=L.hair;c.beginPath();c.ellipse(58,52,20,14,0,Math.PI,0);c.fill();c.fillStyle=L.hatC;c.beginPath();c.moveTo(34,52);c.quadraticCurveTo(58,26,82,52);c.quadraticCurveTo(88,80,80,98);c.lineTo(76,96);c.quadraticCurveTo(80,72,76,56);c.quadraticCurveTo(58,40,40,56);c.quadraticCurveTo(36,74,40,96);c.lineTo(34,98);c.quadraticCurveTo(28,76,34,52);c.fill();}
  c.restore();}

/* ═════════ input (unchanged, verified by touch tests) ═════════ */
const DEAD=.12,MAX_SPEED=6,ACCEL=16,STOP=22,RADIUS=.42;
const SENS=[{n:'低',v:.0032},{n:'中',v:.0052},{n:'高',v:.0078}];let sensI=1;
const st={pos:new THREE.Vector3(0,0,12),vel:new THREE.Vector3(),yaw:0,pitch:.3,dist:6.5,
  joy:{id:null,cx:0,cy:0,dx:0,dy:0},look:{id:null,x:0,y:0},keys:{},layout:''};
const joyEl=$('#joy'),knob=$('#knob');
function joyR(){return joyEl.offsetWidth/2;}
function restPos(){const r=joyR();const land=innerWidth>innerHeight;return{x:16+r+(land?28:22),y:innerHeight-r-(land?22:40)};}
function placeJoy(x,y){joyEl.style.left=x+'px';joyEl.style.top=y+'px';}
function setKnob(dx,dy){knob.style.transform=`translate(${dx}px,${dy}px)`;}
function joyVector(){const j=st.joy;if(j.id===null){
    let x=(st.keys.d||st.keys.arrowright?1:0)-(st.keys.a||st.keys.arrowleft?1:0),y=(st.keys.w||st.keys.arrowup?1:0)-(st.keys.s||st.keys.arrowdown?1:0);const l=Math.hypot(x,y);return l?{x:x/l,y:y/l,mag:1}:{x:0,y:0,mag:0};}
  const r=joyR();let x=j.dx/r,y=-j.dy/r;const l=Math.hypot(x,y);if(l>1){x/=l;y/=l;}const m=Math.min(1,l);
  if(m<DEAD)return{x:0,y:0,mag:0};const k=(m-DEAD)/(1-DEAD);return{x:x/m*k,y:y/m*k,mag:k};}
function inJoyZone(x,y){return x<innerWidth*.45&&y>innerHeight*.28;}
const touch=$('#touch');
touch.addEventListener('pointerdown',e=>{hideHint();
  if(st.joy.id===null&&inJoyZone(e.clientX,e.clientY)){const r=joyR();st.joy.id=e.pointerId;st.joy.cx=clamp(e.clientX,r+8,innerWidth*.45);st.joy.cy=clamp(e.clientY,r+60,innerHeight-r-8);st.joy.dx=e.clientX-st.joy.cx;st.joy.dy=e.clientY-st.joy.cy;
    placeJoy(st.joy.cx,st.joy.cy);joyEl.classList.remove('idle');updKnob();}
  else if(st.look.id===null){st.look.id=e.pointerId;st.look.x=e.clientX;st.look.y=e.clientY;}
  else return;
  try{touch.setPointerCapture(e.pointerId);}catch(_){}e.preventDefault();});
touch.addEventListener('pointermove',e=>{
  if(e.pointerId===st.joy.id){st.joy.dx=e.clientX-st.joy.cx;st.joy.dy=e.clientY-st.joy.cy;updKnob();}
  else if(e.pointerId===st.look.id){const s=SENS[sensI].v;st.yaw-=(e.clientX-st.look.x)*s;st.pitch=clamp(st.pitch+(e.clientY-st.look.y)*s,-.15,1.1);st.look.x=e.clientX;st.look.y=e.clientY;}
  e.preventDefault();});
function endPointer(e){if(e.pointerId===st.joy.id)releaseJoy();if(e.pointerId===st.look.id)st.look.id=null;}
['pointerup','pointercancel','lostpointercapture'].forEach(t=>touch.addEventListener(t,endPointer));
function updKnob(){const r=joyR();let dx=st.joy.dx,dy=st.joy.dy;const l=Math.hypot(dx,dy);if(l>r){dx*=r/l;dy*=r/l;}setKnob(dx,dy);}
function releaseJoy(){st.joy.id=null;st.joy.dx=st.joy.dy=0;setKnob(0,0);joyEl.classList.add('idle');const p=restPos();placeJoy(p.x,p.y);}
function releaseAll(){releaseJoy();st.look.id=null;st.keys={};}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();st.keys[k]=true;if(k==='e'||k===' ')interact();hideHint();});
addEventListener('keyup',e=>{st.keys[e.key.toLowerCase()]=false;});
addEventListener('blur',releaseAll);
document.addEventListener('visibilitychange',()=>{if(document.hidden)releaseAll();});
document.addEventListener('contextmenu',e=>e.preventDefault());
$('#btnSens').addEventListener('click',()=>{sensI=(sensI+1)%SENS.length;$('#btnSens').textContent='視角靈敏度：'+SENS[sensI].n;});
let hintShown=true;function hideHint(){if(!hintShown)return;hintShown=false;$('#hint').style.opacity='0';setTimeout(()=>$('#hint').hidden=true,700);}

function layout(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;
  st.layout=w>h?'landscape':'portrait';camera.fov=st.layout==='portrait'?66:55;st.dist=st.layout==='portrait'?7:6;camera.updateProjectionMatrix();releaseAll();}
addEventListener('resize',layout);addEventListener('orientationchange',()=>setTimeout(layout,120));

/* ═════════ interaction ═════════ */
let near=null;const act=$('#act'),talk=$('#talk');
act.addEventListener('pointerdown',e=>e.stopPropagation());act.addEventListener('click',interact);
function interact(){if(!near||!talk.hidden)return;const n=near;releaseAll();
  const first=!n.talked;n.talked=true;n.mark.visible=false;const line=n.lines[n.line%n.lines.length];n.line++;
  const done=NPCS.filter(x=>x.talked).length;$('#count').textContent=`${done} / ${NPCS.length}`;
  talk.innerHTML=`<div class="spk"><canvas width="240" height="300"></canvas><div><h2>${n.name}</h2><small>${n.role}${first?'・第一次見面':''}</small><p>${line}</p>${done===NPCS.length&&first?'<p><small>你已經和廣場上的三個人都說過話了。</small></p>':''}</div></div><div class="row"><button id="tNext">再聊一句</button><button id="tClose">離開</button></div>`;
  drawPortrait(talk.querySelector('canvas'),n.id);hideHint();talk.hidden=false;act.hidden=true;
  $('#tNext').onclick=()=>{talk.hidden=true;interact();};$('#tClose').onclick=()=>{talk.hidden=true;};}

/* ═════════ simulation ═════════ */
const fwd=new THREE.Vector3(),right=new THREE.Vector3(),target=new THREE.Vector3();
function collide(p){p.x=clamp(p.x,-26,26);p.z=clamp(p.z,-26,29);
  for(const c of colliders){const cx=clamp(p.x,c.x0,c.x1),cz=clamp(p.z,c.z0,c.z1);const dx=p.x-cx,dz=p.z-cz,d2=dx*dx+dz*dz;
    if(d2<RADIUS*RADIUS){if(d2>1e-8){const d=Math.sqrt(d2);p.x=cx+dx/d*RADIUS;p.z=cz+dz/d*RADIUS;}else{const l=[p.x-c.x0,c.x1-p.x,p.z-c.z0,c.z1-p.z];const i=l.indexOf(Math.min(...l));if(i===0)p.x=c.x0-RADIUS;if(i===1)p.x=c.x1+RADIUS;if(i===2)p.z=c.z0-RADIUS;if(i===3)p.z=c.z1+RADIUS;}}}}
let input={x:0,y:0,mag:0},simT=0;
function step(dt){simT+=dt;
  input=talk.hidden?joyVector():{x:0,y:0,mag:0};
  fwd.set(-Math.sin(st.yaw),0,-Math.cos(st.yaw));right.set(Math.cos(st.yaw),0,-Math.sin(st.yaw));
  target.set(0,0,0).addScaledVector(fwd,input.y).addScaledVector(right,input.x).multiplyScalar(MAX_SPEED);
  const k=1-Math.exp(-dt*(input.mag>0?ACCEL:STOP));st.vel.lerp(target,k);
  if(input.mag===0&&st.vel.length()<.05)st.vel.set(0,0,0);
  st.pos.addScaledVector(st.vel,dt);collide(st.pos);
  player.position.copy(st.pos);const sp=st.vel.length();
  if(sp>.1){const a=Math.atan2(st.vel.x,st.vel.z);let d=a-player.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));player.rotation.y+=d*Math.min(1,dt*14);}
  animate(player,sp,simT,dt);
  const cp=Math.cos(st.pitch);camera.position.set(st.pos.x+Math.sin(st.yaw)*st.dist*cp,1.7+Math.sin(st.pitch)*st.dist,st.pos.z+Math.cos(st.yaw)*st.dist*cp);
  camera.lookAt(st.pos.x,1.45,st.pos.z);
  walkers.forEach(w=>{const px=w.o.position.x,pz=w.o.position.z;w.a+=w.s*dt;const x=Math.cos(w.a)*w.r,z=4+Math.sin(w.a)*w.r*.7;w.o.rotation.y=Math.atan2(x-px,z-pz);w.o.position.set(x,0,z);animate(w.o,Math.abs(w.s)*w.r*1.1,simT,dt);});
  near=null;let best=2.6;NPCS.forEach(n=>{const dx=st.pos.x-n.obj.position.x,dz=st.pos.z-n.obj.position.z,d=Math.hypot(dx,dz);
    const want=d<5?Math.atan2(dx,dz):0;let df=want-n.obj.rotation.y;df=Math.atan2(Math.sin(df),Math.cos(df));n.obj.rotation.y+=df*Math.min(1,dt*4);
    animate(n.obj,0,simT,dt);n.mark.position.y=3.1+Math.sin(simT*2.4)*.08;n.mark.rotation.y=simT*1.6;if(d<best){best=d;near=n;}});
  updPigeons(dt,simT,st.pos);
  if(talk.hidden){act.hidden=!near;if(near)act.textContent='與'+near.name+'交談';}
}
function frameFx(t){waveFlags(t);
  sun.position.copy(st.pos).addScaledVector(SUN_DIR,80);sun.target.position.copy(st.pos);
  dust.position.set(st.pos.x,0,st.pos.z);const a=dust.geometry.attributes.position.array;for(let i=1;i<a.length;i+=3){a[i]+=.004;if(a[i]>6)a[i]=0;}dust.geometry.attributes.position.needsUpdate=true;}

// Fixed-step simulation driven by real time, so movement and stopping take the same wall-clock time on slow and fast phones.
const STEP=1/60;let last=performance.now(),acc=0,ema=16,slowFrames=0,quality=0,frames=0;
function lowerQuality(){quality++;if(quality===1)renderer.setPixelRatio(Math.min(1.5,window.devicePixelRatio||1)*.8);
  if(quality===2){sun.shadow.mapSize.set(1024,1024);sun.shadow.map&&sun.shadow.map.dispose();sun.shadow.map=null;dust.visible=false;}
  if(quality===3){renderer.shadowMap.enabled=false;scene.traverse(o=>{if(o.material)o.material.needsUpdate=true;});renderer.setPixelRatio(.75);}
  renderer.setSize(innerWidth,innerHeight,false);}
function loop(now){const real=(now-last)/1000;last=now;acc+=Math.min(.25,real);
  while(acc>=STEP){step(STEP);acc-=STEP;}
  frameFx(simT);renderer.render(scene,camera);frames++;
  if(frames===2){const l=$('#load');l.style.opacity='0';setTimeout(()=>l.hidden=true,600);}
  ema=ema*.9+real*1000*.1;if(ema>40&&quality<3){if(++slowFrames>8){slowFrames=0;lowerQuality();}}else slowFrames=0;
  requestAnimationFrame(loop);}
layout();requestAnimationFrame(loop);

// test hook: read-only snapshot for automated checks
window.__game={get state(){return{x:st.pos.x,z:st.pos.z,speed:st.vel.length(),yaw:st.yaw,pitch:st.pitch,input:{...input},joyActive:st.joy.id!==null,quality,frames,lookActive:st.look.id!==null,layout:st.layout};}};
</script>
