:root{

}
*{box-sizing:border-box}
html,body{height:100%}
body{background:#8E8463;color:var(--ink);font:500 17px/1.45 var(--body);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  -webkit-user-select:none;user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance}
.btn{background:var(--sun);color:var(--ink);border:2px solid var(--ink);border-radius:14px;padding:10px 18px;box-shadow:0 4px 0 var(--ink);font-weight:700;font-size:19px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:var(--paper)}
.btn:disabled{opacity:.45}
.chip{background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:5px 12px;font-size:15px;font-weight:700}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;pointer-events:none;
  padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
#hud>*{pointer-events:auto}
.meter{background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:4px 10px;min-width:128px;font-size:13px;font-weight:700;line-height:1.3}
.bar{height:10px;border:2px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}
.bar i{display:block;height:100%;background:var(--smog);transition:width .3s}
.bar.hp i{background:var(--bad)} .bar.me i{background:var(--leaf)}

#arrow{display:inline-block;font-size:18px;line-height:1}

#joy i{position:absolute;left:35px;top:35px;width:44px;height:44px;border-radius:50%;background:var(--sun);border:3px solid var(--ink)}
#act{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(34px + env(safe-area-inset-bottom,0px));max-width:56vw;text-align:left;line-height:1.15;animation:pulse 1s infinite}
#act small{display:block;font-size:13px;font-weight:500}
@keyframes pulse{50%{transform:scale(1.06)}}
#toast{position:fixed;left:50%;bottom:calc(170px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);border-radius:14px;padding:8px 16px;font-weight:700;font-size:18px;width:max-content;max-width:88vw;text-align:center;pointer-events:none}

/* overlay cards */
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(23,48,31,.45);touch-action:pan-y;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ov.clear{background:rgba(23,48,31,.15)}

.card h1{font-size:clamp(30px,9vw,44px);color:var(--leaf)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.hint{margin:0;color:var(--soft);font-size:15px}
.ask{margin:0;font-family:var(--display);font-weight:700;font-size:22px;line-height:1.3;text-align:center}
.blank{display:inline-block;min-width:60px;border-bottom:4px solid var(--leaf);margin:0 4px;height:1em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.one{grid-template-columns:1fr}
.opt{background:#fff;border:2px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);padding:10px;min-height:54px;font-size:19px;font-weight:700;min-width:0;overflow-wrap:anywhere}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.opt.ok{background:var(--leaf);color:#fff}.opt.no{background:var(--bad);color:#fff}
.answer,.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:50px}
.answer{border:2px dashed var(--soft);border-radius:14px;padding:8px}
.tile{background:#fff;border:2px solid var(--ink);border-radius:10px;box-shadow:0 3px 0 var(--ink);padding:6px 12px;font-size:19px;font-weight:700}
.fb{border:2px solid var(--ink);border-radius:14px;padding:10px 12px;background:#fff;display:flex;flex-direction:column;gap:8px}
.fb b{font-size:20px}.fb.good b{color:var(--leaf)}.fb.bad b{color:var(--bad)}.fb p{margin:0;font-size:16px}
.fight{display:grid;gap:6px;font-size:14px;font-weight:700}
.fight .bar{height:14px}
.todo{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.todo li{background:#fff;border-radius:10px;padding:8px 10px;font-weight:700;font-size:16px}
.todo li.done{color:var(--leaf)}.todo li small{display:block;color:var(--soft);font-weight:500}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{background:#fff;border:2px solid var(--ink);border-radius:999px;padding:5px 14px;font-size:15px;font-weight:700}
.tabs button[aria-pressed="true"]{background:var(--leaf);color:#fff}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.words button{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:8px;text-align:left;font-weight:700;min-width:0;line-height:1.25}
.words small{display:block;color:var(--soft);font-weight:500}
.note{display:grid;gap:8px}.note div{background:#fff;border-radius:12px;padding:10px 12px;font-size:16px}.note em{font-style:normal;font-weight:700;color:var(--leaf)}
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center;font-weight:700}
.score div{border:2px solid var(--ink);border-radius:12px;color:#fff;font-size:22px;padding:2px}
.score .r{background:var(--bad)}.score .b{background:var(--blue)}
.buzzers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.buzzers button{border:3px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);color:#fff;font-weight:700;font-size:22px;padding:18px 6px}
.buzzers button:disabled{opacity:.35}
#bzR{background:var(--bad)}#bzB{background:var(--blue)}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
#flash{position:fixed;inset:0;background:rgba(229,72,77,.38);pointer-events:none}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

    for(let i=0;i<6;i++){const x=pl.position.x+(i?(Math.random()-.5)*13:0),z=pl.position.z+(i?(Math.random()-.5)*13:0);
     const ring=add(new T.CircleGeometry(1.8,22),new T.MeshBasicMaterial({color:0xff3b30,transparent:true,opacity:.5}),x,.07,z,dyn);ring.rotation.x=-Math.PI/2;ring.castShadow=false;
     const junk=box(.9,.9,.9,[0x8a8a8a,0x7a5230,0x4a5568][i%3],x,24,z,dyn);falls.push({ring,junk,x,z,t:2})}}
   for(let i=falls.length-1;i>=0;i--){const f=falls[i];f.t-=dt;f.junk.position.y=Math.max(.45,f.t/2*24);f.junk.rotation.x+=dt*5;f.ring.material.opacity=.35+.25*Math.sin(t*14);
    if(f.t<=0){dyn.remove(f.ring);f.junk.userData.gone=1.2;anims.push(f.junk);falls.splice(i,1);if(Math.hypot(f.x-pl.position.x,f.z-pl.position.z)<2)hazard(12,'被垃圾砸到了')}}
   if(puffs.length&&St.done>=St.total){puffs.forEach(p=>dyn.remove(p.g));puffs.length=0}

    p.g.rotation.y=t*.4;if(Math.hypot(p.g.position.x-pl.position.x,p.g.position.z-pl.position.z)<2.7){p.acc+=dt;if(p.acc>=1){p.acc=0;hazard(6,'咳咳！快離開毒煙')}}else p.acc=.5}
   if(ev.quiz<=0&&!B&&!paused){ev.quiz=45+Math.random()*25;emergency()}
   /* nearest task */
   let best=null,bd=1e9,navT=null,nd=1e9;
   for(const k of St.tasks){if(k.done)continue;if(k.kind==='hotel'&&k.i!==St.hotel)continue;const d=Math.hypot(k.x-pl.position.x,k.z-pl.position.z);if(d<nd){nd=d;navT=k}if(d<2.6&&d<bd){bd=d;best=k}}
   for(const k of St.lunch){const d=Math.hypot(k.x-pl.position.x,k.z-pl.position.z);if(d<2.2&&d<bd){bd=d;best=Object.assign(k,{lunch:1})}}
   if(!navT&&St.boss&&!St.bossDead){navT={x:St.boss.g.position.x,z:St.boss.g.position.z,bossNav:1};nd=Math.hypot(navT.x-pl.position.x,navT.z-pl.position.z)}
   if(best!==near){near=best;const a=$('act');if(near){a.innerHTML=near.lunch?'Eat the leftovers<small>吃剩菜補血</small>':`${KIND[near.kind].en}<small>${KIND[near.kind].zh}（按這裡或 E 鍵）</small>`;a.hidden=false}else a.hidden=true}
   if(navT){const dx=navT.x-pl.position.x,dz=navT.z-pl.position.z,s=Math.sin(yaw),c=Math.cos(yaw),rx=dx*c-dz*s,fy=-dx*s-dz*c;$('arrow').style.transform=`rotate(${Math.atan2(rx,fy)}rad)`;
    $('navT').textContent=navT.bossNav?`Pollution King ${Math.round(nd)} m`:`${KIND[navT.kind].en} ${Math.round(nd)} m`;$('nav').hidden=false}else $('nav').hidden=true}
  /* ambient animation */
  dyn.children.forEach(o=>{const u=o.userData;if(u.bob){o.position.y=u.bob+Math.sin(t*3+o.position.x)*.2;o.rotation.y=t*2}if(u.drip){o.position.y=1-((t*1.2+o.position.x)%1)*.9}});
  for(const a of anims){if(a.userData.gone>0){a.userData.gone-=dt;if(a.userData.gone<=0)dyn.remove(a)}if(a.userData.grow){const s=Math.min(1,a.scale.x+dt*.9);a.scale.setScalar(s)}if(a.userData.bee!==undefined){const p=t*1.6+a.userData.bee;a.position.set(-12+Math.cos(p)*1.8,2.2+Math.sin(p*2)*.4,12+Math.sin(p)*1.2)}}

  const cp=Math.cos(pitch);let cd=dist;for(let k=0;k<7;k++){cam.position.set(pl.position.x+Math.sin(yaw)*cd*cp,1.6+cd*Math.sin(pitch),pl.position.z+Math.cos(yaw)*cd*cp);if(Math.abs(cam.position.x)<9&&cam.position.z<-25.4&&cam.position.y<10.5)cd*=.72;else break}cam.lookAt(pl.position.x,1.6,pl.position.z);sun.position.set(pl.position.x+18,34,pl.position.z+12);sun.target.position.copy(pl.position);smog.rotation.y=t*.03;clouds.forEach((c,i)=>{c.position.x+=dt*(.6+i%3*.3);if(c.position.x>110)c.position.x=-110});
  ren.render(scene,cam)}
 requestAnimationFrame(frame)}
